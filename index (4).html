<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Emozeka — Kişisel Yapay Zeka</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0c0c0f;
      --sidebar: #121216;
      --surface: #1a1a1f;
      --surface-hover: #222228;
      --border: #2a2a32;
      --text: #e8e8ed;
      --text-muted: #8b8b9a;
      --accent: #7c5cff;
      --accent-hover: #6a4aef;
      --accent-soft: rgba(124, 92, 255, 0.15);
      --user-bubble: #7c5cff;
      --ai-bubble: #1e1e25;
      --success: #34d399;
      --danger: #f87171;
      --radius: 16px;
      --radius-sm: 10px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
      display: flex;
    }
    .sidebar {
      width: 280px;
      background: var(--sidebar);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      transition: transform 0.3s ease;
    }
    .sidebar-header {
      padding: 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .logo {
      width: 36px; height: 36px;
      background: linear-gradient(135deg, #7c5cff, #a78bfa);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 18px; color: white;
    }
    .brand { font-weight: 700; font-size: 18px; letter-spacing: -0.3px; }
    .brand span { color: var(--accent); }
    .new-chat-btn {
      margin: 16px;
      padding: 12px 16px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: var(--radius-sm);
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.2s;
    }
    .new-chat-btn:hover { background: var(--accent-hover); }
    .chat-history { flex: 1; overflow-y: auto; padding: 8px 12px; }
    .history-item {
      padding: 12px 14px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-size: 14px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 4px;
    }
    .history-item:hover, .history-item.active {
      background: var(--surface);
      color: var(--text);
    }
    .sidebar-footer {
      padding: 16px;
      border-top: 1px solid var(--border);
      font-size: 12px;
      color: var(--text-muted);
      text-align: center;
    }
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
    }
    .topbar {
      height: 60px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      background: rgba(12, 12, 15, 0.8);
      backdrop-filter: blur(12px);
    }
    .topbar-title { font-weight: 600; font-size: 15px; }
    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--text-muted);
    }
    .status-dot {
      width: 8px; height: 8px;
      background: var(--success);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--success);
    }
    .chat-area {
      flex: 1;
      overflow-y: auto;
      padding: 32px 24px;
      display: flex;
      flex-direction: column;
      gap: 24px;
      scroll-behavior: smooth;
    }
    .message {
      display: flex;
      gap: 14px;
      max-width: 780px;
      width: 100%;
      margin: 0 auto;
      animation: fadeIn 0.3s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .avatar {
      width: 36px; height: 36px;
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 14px;
      flex-shrink: 0;
    }
    .avatar.ai {
      background: linear-gradient(135deg, #7c5cff, #a78bfa);
      color: white;
    }
    .avatar.user {
      background: var(--surface);
      color: var(--text-muted);
      border: 1px solid var(--border);
    }
    .bubble {
      padding: 14px 18px;
      border-radius: var(--radius);
      font-size: 15px;
      line-height: 1.65;
      max-width: 100%;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .message.ai .bubble {
      background: var(--ai-bubble);
      border: 1px solid var(--border);
    }
    .message.user { flex-direction: row-reverse; }
    .message.user .bubble {
      background: var(--user-bubble);
      color: white;
    }
    .message.error .bubble {
      border-color: var(--danger);
      color: var(--danger);
    }
    .typing {
      display: flex; gap: 5px; padding: 8px 4px;
    }
    .typing span {
      width: 7px; height: 7px;
      background: var(--text-muted);
      border-radius: 50%;
      animation: bounce 1.4s infinite ease-in-out both;
    }
    .typing span:nth-child(1) { animation-delay: -0.32s; }
    .typing span:nth-child(2) { animation-delay: -0.16s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0); }
      40% { transform: scale(1); }
    }
    .input-area {
      padding: 16px 24px 24px;
      background: linear-gradient(to top, var(--bg) 60%, transparent);
    }
    .input-wrapper {
      max-width: 780px;
      margin: 0 auto;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      display: flex;
      align-items: flex-end;
      padding: 10px 12px 10px 18px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .input-wrapper:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }
    #userInput {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-size: 15px;
      font-family: inherit;
      resize: none;
      max-height: 150px;
      line-height: 1.5;
      padding: 6px 0;
    }
    #userInput::placeholder { color: var(--text-muted); }
    .send-btn {
      width: 40px; height: 40px;
      background: var(--accent);
      border: none;
      border-radius: 12px;
      color: white;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.2s, transform 0.15s;
      flex-shrink: 0;
    }
    .send-btn:hover { background: var(--accent-hover); }
    .send-btn:active { transform: scale(0.95); }
    .send-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .hint {
      text-align: center;
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 10px;
    }
    .welcome {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 20px;
      gap: 12px;
    }
    .welcome-logo {
      width: 72px; height: 72px;
      background: linear-gradient(135deg, #7c5cff, #a78bfa);
      border-radius: 20px;
      display: flex; align-items: center; justify-content: center;
      font-size: 32px; font-weight: 700; color: white;
      margin-bottom: 8px;
      box-shadow: 0 12px 40px rgba(124, 92, 255, 0.3);
    }
    .welcome h1 { font-size: 28px; font-weight: 700; letter-spacing: -0.5px; }
    .welcome p { color: var(--text-muted); font-size: 15px; max-width: 380px; line-height: 1.5; }
    .suggestions {
      display: flex; flex-wrap: wrap; gap: 10px;
      justify-content: center; margin-top: 24px; max-width: 560px;
    }
    .suggestion {
      padding: 10px 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.15s;
      color: var(--text-muted);
    }
    .suggestion:hover {
      background: var(--surface-hover);
      border-color: var(--accent);
      color: var(--text);
    }
    .menu-btn {
      display: none;
      background: none;
      border: none;
      color: var(--text);
      font-size: 22px;
      cursor: pointer;
      padding: 4px;
    }
    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 99;
    }
    .overlay.show { display: block; }
    @media (max-width: 768px) {
      .sidebar {
        position: fixed;
        left: 0; top: 0; bottom: 0;
        z-index: 100;
        transform: translateX(-100%);
      }
      .sidebar.open { transform: translateX(0); }
      .menu-btn { display: block; }
    }
  </style>
</head>
<body>
  <div class="overlay" id="overlay" onclick="toggleSidebar()"></div>

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="logo">E</div>
      <div class="brand">Emo<span>zeka</span></div>
    </div>
    <button class="new-chat-btn" onclick="newChat()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <line x1="12" y1="5" x2="12" y2="19"></line>
        <line x1="5" y1="12" x2="19" y2="12"></line>
      </svg>
      Yeni sohbet
    </button>
    <div class="chat-history" id="chatHistory">
      <div class="history-item active">Yeni sohbet</div>
    </div>
    <div class="sidebar-footer">Emozeka • Herkes için AI</div>
  </aside>

  <main class="main">
    <div class="topbar">
      <button class="menu-btn" onclick="toggleSidebar()">☰</button>
      <div class="topbar-title">Emozeka</div>
      <div class="status">
        <div class="status-dot"></div>
        <span id="statusText">Çevrimiçi</span>
      </div>
    </div>

    <div class="chat-area" id="chatArea">
      <div class="welcome" id="welcome">
        <div class="welcome-logo">E</div>
        <h1>Merhaba, ben Emozeka</h1>
        <p>Gerçek yapay zeka ile konuşuyorsun. Matematik, yazı, sohbet... Ne istersen sor, key gerekmez.</p>
        <div class="suggestions">
          <div class="suggestion" onclick="ask('Merhaba, sen kimsin?')">Merhaba de</div>
          <div class="suggestion" onclick="ask('125 x 48 kaç eder?')">Matematik sor</div>
          <div class="suggestion" onclick="ask('Bana kısa bir hikaye yaz')">Hikaye yaz</div>
          <div class="suggestion" onclick="ask('Bugün moralim bozuk, motive et')">Motive et</div>
        </div>
      </div>
    </div>

    <div class="input-area">
      <div class="input-wrapper">
        <textarea id="userInput" rows="1" placeholder="Bir şeyler yaz..." onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
        <button class="send-btn" id="sendBtn" onclick="sendMessage()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </div>
      <div class="hint">Enter ile gönder • Shift+Enter ile yeni satır</div>
    </div>
  </main>

  <script>
    const chatArea = document.getElementById('chatArea');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    const welcome = document.getElementById('welcome');
    const statusText = document.getElementById('statusText');

    let messages = [];
    let isTyping = false;

    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('open');
      document.getElementById('overlay').classList.toggle('show');
    }

    function autoResize(el) {
      el.style.height = 'auto';
      el.style.height = Math.min(el.scrollHeight, 150) + 'px';
    }

    function handleKey(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    }

    function ask(text) {
      userInput.value = text;
      sendMessage();
    }

    function newChat() {
      messages = [];
      chatArea.innerHTML = '';
      chatArea.appendChild(welcome);
      welcome.style.display = 'flex';
      document.querySelectorAll('.history-item').forEach(el => el.classList.remove('active'));
    }

    function formatText(text) {
      return text
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/\n/g, '<br>')
        .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
        .replace(/`([^`]+)`/g, '<code style="background:rgba(255,255,255,0.08);padding:2px 5px;border-radius:4px;font-size:13px">$1</code>');
    }

    function addMessage(text, isUser, isError) {
      if (welcome.style.display !== 'none') welcome.style.display = 'none';
      const msg = document.createElement('div');
      msg.className = 'message ' + (isUser ? 'user' : 'ai') + (isError ? ' error' : '');
      msg.innerHTML =
        '<div class="avatar ' + (isUser ? 'user' : 'ai') + '">' + (isUser ? 'Sen' : 'E') + '</div>' +
        '<div class="bubble">' + formatText(text) + '</div>';
      chatArea.appendChild(msg);
      chatArea.scrollTop = chatArea.scrollHeight;
    }

    function showTyping() {
      const typing = document.createElement('div');
      typing.className = 'message ai';
      typing.id = 'typingIndicator';
      typing.innerHTML =
        '<div class="avatar ai">E</div><div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>';
      chatArea.appendChild(typing);
      chatArea.scrollTop = chatArea.scrollHeight;
    }

    function removeTyping() {
      const t = document.getElementById('typingIndicator');
      if (t) t.remove();
    }

    async function callAPI(userMessage) {
      messages.push({ role: 'user', content: userMessage });

      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages: messages })
      });

      const data = await res.json();

      if (!res.ok) {
        throw new Error(data.error || 'Bir hata oluştu');
      }

      messages.push({ role: 'assistant', content: data.reply });
      return data.reply;
    }

    async function sendMessage() {
      const text = userInput.value.trim();
      if (!text || isTyping) return;

      addMessage(text, true);
      userInput.value = '';
      autoResize(userInput);
      isTyping = true;
      sendBtn.disabled = true;
      statusText.textContent = 'Düşünüyor...';

      showTyping();

      try {
        const reply = await callAPI(text);
        removeTyping();
        addMessage(reply, false);
        statusText.textContent = 'Çevrimiçi';
      } catch (err) {
        removeTyping();
        addMessage('⚠️ ' + err.message, false, true);
        statusText.textContent = 'Hata';
        if (messages.length && messages[messages.length - 1].role === 'user') {
          messages.pop();
        }
      }

      isTyping = false;
      sendBtn.disabled = false;
      userInput.focus();
    }

    userInput.focus();
  </script>
</body>
</html>
