<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>EmoZeka - Giriş Yap</title>
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #1e293b; padding: 30px; border-radius: 12px; width: 320px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        h2 { text-align: center; color: #a855f7; }
        input { width: 100%; padding: 10px; margin: 10px 0; background: #0f172a; border: 1px solid #334155; color: white; border-radius: 6px; box-sizing: border-box;}
        button { width: 100%; padding: 10px; background: #6366f1; border: none; color: white; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 10px;}
        button:hover { background: #4f46e5; }
        .error { color: #ef4444; font-size: 14px; text-align: center; }
        p { text-align: center; font-size: 14px; }
        a { color: #818cf8; text-decoration: none; }
    </style>
</head>
<body>
    <div class="card">
        <h2>EmoZeka Giriş</h2>
        {% if error %}<div class="error">{{ error }}</div>{% endif %}
        <form method="POST">
            <input type="text" name="username" placeholder="Kullanıcı Adı" required>
            <input type="password" name="password" placeholder="Şifre" required>
            <button type="submit">Giriş Yap</button>
        </form>
        <p>Hesabın yok mu? <a href="/register">Kayıt Ol</a></p>
    </div>
</body>
</html>
