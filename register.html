<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>EmoZeka - Kayıt Ol</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #0b0f19; height: 100vh; display: flex; justify-content: center; align-items: center; color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .auth-card { background: #111827; border: 1px solid #1f2937; padding: 40px; border-radius: 16px; width: 100%; max-width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .logo { font-weight: 900; font-size: 28px; text-align: center; margin-bottom: 25px; background: linear-gradient(45deg, #ff3366, #ff9933); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .form-control { background: #1f2937; border: 1px solid #374151; color: #fff; }
        .form-control:focus { background: #1f2937; color: #fff; border-color: #ff3366; box-shadow: none; }
        .btn-custom { background: #ff9933; border: none; font-weight: bold; width: 100%; padding: 10px; color: #0b0f19; }
        .btn-custom:hover { background: #e08529; }
        .link-text { color: #38bdf8; text-decoration: none; }
        .link-text:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="auth-card">
        <div class="logo">⚡ EMOZEKA AI</div>
        <div id="errorAlert" class="alert alert-danger d-none py-2 text-center" style="font-size: 14px;"></div>
        
        <form id="registerForm" onsubmit="handleRegister(event)">
            <div class="mb-3">
                <label class="form-label text-secondary small fw-bold">KULLANICI ADI</label>
                <input type="text" id="username" class="form-control" required autofocus>
            </div>
            <div class="mb-3">
                <label class="form-label text-secondary small fw-bold">ŞİFRE</label>
                <input type="password" id="password" class="form-control" required>
            </div>
            <div class="mb-4">
                <label class="form-label text-secondary small fw-bold">DAVETİYE KODU (EMOZEKA2026)</label>
                <input type="text" id="kod" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-custom mb-3">KAYIT OL KANKA</button>
        </form>
        
        <div class="text-center mt-3 small">
            Zaten hesabın var mı lan? <a href="/login" class="link-text">Giriş Yap</a>
        </div>
    </div>

    <script>
        async function handleRegister(event) {
            event.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const kod = document.getElementById('kod').value;
            const errorAlert = document.getElementById('errorAlert');

            const response = await fetch('/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password, kod })
            });
            const data = await response.json();

            if (data.success) {
                window.location.href = '/';
            } else {
                errorAlert.innerText = data.error || "Kayıt başarısız kanka!";
                errorAlert.classList.remove('d-none');
            }
        }
    </script>
</body>
</html>
