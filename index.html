<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>EmoZeka - Yapay Zeka Asistanı</title>
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: sans-serif; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .chat-container { width: 450px; height: 600px; background: #1e293b; border-radius: 12px; display: flex; flex-direction: column; box-shadow: 0 4px 20px rgba(0,0,0,0.6); overflow: hidden; }
        .header { background: linear-gradient(135deg, #6366f1, #a855f7); padding: 15px; text-align: center; position: relative; }
        .header h2 { margin: 0; font-size: 20px; }
        .header p { margin: 5px 0 0 0; font-size: 12px; opacity: 0.9; }
        .logout-btn { position: absolute; right: 15px; top: 15px; background: rgba(255,255,255,0.2); color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; }
        .logout-btn:hover { background: rgba(255,255,255,0.3); }
        .toolbar { padding: 8px 15px; background: #0f172a; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; }
        .toolbar select { background: #1e293b; color: white; border: 1px solid #475569; padding: 5px; border-radius: 4px; }
        .chat-box { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .message { padding: 10px 14px; border-radius: 8px; max-width: 80%; line-height: 1.4; word-break: break-word; white-space: pre-wrap; }
        .user { background: #6366f1; align-self: flex-end; color: white; }
        .assistant { background: #334155; align-self: flex-start; color: #f8fafc; }
        .input-area { padding: 15px; background: #0f172a; display: flex; gap: 10px; border-top: 1px solid #334155; }
        input[type="text"] { flex: 1; padding: 10px; border-radius: 6px; border: 1px solid #475569; background: #1e293b; color: white; outline: none; }
        button.send-btn { padding: 10px 15px; background: #6366f1; border: none; color: white; border-radius: 6px; font-weight: bold; cursor: pointer; }
        button.send-btn:hover { background: #4f46e5; }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="header">
            <h2>EmoZeka</h2>
            <p>Hoş geldin, {{ username }}</p>
            <button class="logout-btn" onclick="window.location.href='/logout'">Çıkış</button>
        </div>
        
        <div class="toolbar">
            <span style="font-size: 13px; color: #94a3b8;">Mod Seçimi:</span>
            <select id="aiMode">
                <option value="sohbet">Empatik Sohbet</option>
                <option value="soru">Soru Çözme & Koçluk</option>
                <option value="rap">Rap Sözü Yazarı</option>
            </select>
        </div>

        <div class="chat-box" id="chatBox">
            <div class="message assistant">Merhaba {{ username }}! Ben EmoZeka. Bugün sana hangi konuda destek olmamı istersin?</div>
        </div>

        <div class="input-area">
            <input type="text" id="userInput" placeholder="Mesajınızı yazın..." onkeypress="checkEnter(event)">
            <button class="send-btn" onclick="sendMessage()">Gönder</button>
        </div>
    </div>

    <script>
        function checkEnter(e) {
            if (e.key === 'Enter') sendMessage();
        }

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const chatBox = document.getElementById('chatBox');
            const modeSelect = document.getElementById('aiMode');
            const text = input.value.trim();
            if (!text) return;

            // Kullanıcı mesajını ekle
            chatBox.innerHTML += `<div class="message user">${text}</div>`;
            input.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            // Düşünüyor göstergesi
            const loadingId = 'loading-' + Date.now();
            chatBox.innerHTML += `<div class="message assistant" id="${loadingId}">Düşünüyor...</div>`;
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const response = await fetch('/chat-api', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text, mode: modeSelect.value })
                });
                const data = await response.json();
                
                document.getElementById(loadingId).remove();

                if (data.assistant) {
                    chatBox.innerHTML += `<div class="message assistant">${data.assistant}</div>`;
                } else {
                    chatBox.innerHTML += `<div class="message assistant" style="color:#ef4444;">Hata: ${data.error}</div>`;
                }
            } catch (err) {
                document.getElementById(loadingId).remove();
                chatBox.innerHTML += `<div class="message assistant" style="color:#ef4444;">Bağlantı hatası oluştu.</div>`;
            }
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>
